<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATM Simulator</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="card"><h1>ATM SIMULATOR</h1><div id="msg"></div><section id="login"><h2>Enter PIN</h2><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN"><button onclick="login()">LOGIN</button></section><section id="mobile" class="hide"><h2>OTP Verification</h2><input id="mobileNumber" inputmode="tel" placeholder="9876543210"><button onclick="sendOtp()">SEND OTP</button></section><section id="otp" class="hide"><h2>Enter OTP</h2><input id="otpValue" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"><button onclick="verifyOtp()">VERIFY OTP</button><button class="secondary" onclick="sendOtp()">RESEND OTP</button></section><section id="menu" class="hide"><h2>ATM MENU</h2><button onclick="action('balance')">CHECK BALANCE</button><button onclick="money('deposit')">DEPOSIT MONEY</button><button onclick="money('withdraw')">WITHDRAW MONEY</button><button onclick="changePin()">CHANGE PIN</button><button class="danger" onclick="logout()">EXIT</button></section></main><script>
const $=id=>document.getElementById(id);function only(id){['login','mobile','otp','menu'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function msg(t,good=false){$('msg').textContent=t;$('msg').className=good?'good':''}async function api(u,b){let r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d}async function login(){try{await api('/api/login',{pin:$('pin').value});only('mobile');msg('PIN verified. Enter your mobile number.',true)}catch(e){msg(e.message)}}async function sendOtp(){try{let d=await api('/api/send-otp',{mobile:$('mobileNumber').value});only('otp');msg(d.message,true)}catch(e){msg(e.message)}}async function verifyOtp(){try{await api('/api/verify-otp',{otp:$('otpValue').value});only('menu');msg('OTP verified. Access granted.',true)}catch(e){msg(e.message)}}async function action(a,x={}){try{let d=await api('/api/action',{action:a,...x});msg(d.message,true)}catch(e){msg(e.message)}}function money(a){let v=prompt(a==='deposit'?'Enter deposit amount:':'Enter withdrawal amount:');if(v!==null)action(a,{amount:v})}function changePin(){let o=prompt('Current PIN:'),n=prompt('New 4-digit PIN:'),c=prompt('Confirm new PIN:');if(o&&n&&c)action('change_pin',{old_pin:o,new_pin:n,confirm_pin:c})}async function logout(){await action('logout');only('login');$('pin').value='';$('otpValue').value='';msg('Session ended.')} </script></body></html>
